name: macOS Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  dmg:
    name: 构建 macOS dmg
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/liangzui-ai-app/src-tauri

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 dmg
        run: pnpm tauri:build

      - name: 上传 dmg
        uses: actions/upload-artifact@v4
        with:
          name: liangzui-ai-app-${{ github.ref_name }}
          path: clients/liangzui-ai-app/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
